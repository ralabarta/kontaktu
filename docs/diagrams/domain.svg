<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="domain-title domain-desc" xmlns="http://www.w3.org/2000/svg"><title id="domain-title">Conceptual domain model</title><desc id="domain-desc">A tenant-scoped Contact aggregate owns identity, qualification evidence, chronological interactions, action policy, and a separate human-handoff state.</desc><defs><marker id="domain-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5a665f"/></marker><marker id="domain-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#285a32"/></marker><marker id="domain-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17364b"/></marker></defs><rect width="960" height="600" fill="#eeefe8"/><text class="tag" x="56" y="64">CONCEPTUAL CONTACT MODEL</text><line x1="480" y1="144" x2="480" y2="224" stroke="#285a32" stroke-width="2"/><line x1="152" y1="224" x2="824" y2="224" stroke="#5a665f" stroke-width="1.5"/><line class="edge" x1="152" y1="224" x2="152" y2="288" marker-end="url(#domain-arrow)"/><line class="edge" x1="320" y1="224" x2="320" y2="288" marker-end="url(#domain-arrow)"/><line class="edge" x1="488" y1="224" x2="488" y2="288" marker-end="url(#domain-arrow)"/><line class="edge" x1="656" y1="224" x2="656" y2="288" marker-end="url(#domain-arrow)"/><line class="edge" x1="824" y1="224" x2="824" y2="288" marker-end="url(#domain-arrow)"/><rect class="focal" x="360" y="80" width="240" height="64" rx="8"/><text class="name" x="480" y="112">Contact</text><text class="sub" x="480" y="128">tenant-scoped aggregate</text><rect class="node" x="80" y="288" width="144" height="64" rx="8"/><text class="name" x="152" y="320">Identity</text><text class="sub" x="152" y="336">name · phone · email</text><rect class="node" x="248" y="288" width="144" height="64" rx="8"/><text class="name" x="320" y="320">Qualification</text><text class="sub" x="320" y="336">sale · rental · shared</text><rect class="node" x="416" y="288" width="144" height="64" rx="8"/><text class="name" x="488" y="320">Timeline</text><text class="sub" x="488" y="336">channel · direction</text><rect class="node" x="584" y="288" width="144" height="64" rx="8"/><text class="name" x="656" y="320">Policy</text><text class="sub" x="656" y="336">call · email · WhatsApp</text><rect class="node" x="752" y="288" width="144" height="64" rx="8"/><text class="name" x="824" y="320">Handoff</text><text class="sub" x="824" y="336">requested · reason</text><rect class="soft" x="248" y="416" width="144" height="48" rx="8"/><text class="name" x="320" y="440">Fact evidence</text><text class="sub" x="320" y="456">source · time</text><rect class="soft" x="416" y="416" width="144" height="48" rx="8"/><text class="name" x="488" y="440">Interaction</text><text class="sub" x="488" y="456">content · duration</text><line class="edge" x1="320" y1="352" x2="320" y2="416" marker-end="url(#domain-arrow)"/><line class="edge" x1="488" y1="352" x2="488" y2="416" marker-end="url(#domain-arrow)"/><line x1="40" y1="552" x2="920" y2="552" stroke="#a9b2aa"/><text class="legend" x="40" y="576">PATTERN · CONCEPT HIERARCHY  |  STATIC · OFFLINE-SAFE  |  SOURCE · CURRENT REPOSITORY</text></svg>
