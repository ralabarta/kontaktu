<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="verification-process-title verification-process-desc" xmlns="http://www.w3.org/2000/svg"><title id="verification-process-title">Development and verification process</title><desc id="verification-process-desc">Four ordered stages preserve the same input, gate, and output slots from failing regression through final current-candidate evidence.</desc><defs><marker id="verification-process-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5a665f"/></marker><marker id="verification-process-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#285a32"/></marker><marker id="verification-process-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17364b"/></marker></defs><rect width="960" height="600" fill="#eeefe8"/><text class="tag" x="56" y="64">STAGE FRAMEWORK · SAME SAFETY QUESTION AT EACH HANDOFF</text><line class="edge" x1="240" y1="280" x2="272" y2="280" marker-end="url(#verification-process-arrow)"/><line class="edge-accent" x1="464" y1="280" x2="496" y2="280" marker-end="url(#verification-process-arrow-accent)"/><line class="edge" x1="688" y1="280" x2="720" y2="280" marker-end="url(#verification-process-arrow)"/><text class="tag" x="64" y="120">1 · RED</text><rect class="node" x="48" y="144" width="192" height="272" rx="8"/><text class="name" x="144" y="184">What can fail?</text><text class="label" x="144" y="228">INPUT</text><text class="name" x="144" y="252">Public behavior</text><text class="label" x="144" y="300">GATE</text><text class="name" x="144" y="324">Expected failure</text><text class="label" x="144" y="372">OUTPUT</text><text class="name" x="144" y="396">Regression proof</text><text class="tag" x="288" y="120">2 · GREEN</text><rect class="node" x="272" y="144" width="192" height="272" rx="8"/><text class="name" x="368" y="184">What is minimal?</text><text class="label" x="368" y="228">INPUT</text><text class="name" x="368" y="252">Focused change</text><text class="label" x="368" y="300">GATE</text><text class="name" x="368" y="324">Focused tests</text><text class="label" x="368" y="372">OUTPUT</text><text class="name" x="368" y="396">Passing behavior</text><text class="tag" x="512" y="120">3 · REFACTOR</text><rect class="focal" x="496" y="144" width="192" height="272" rx="8"/><text class="name" x="592" y="184">What can simplify?</text><text class="label" x="592" y="228">INPUT</text><text class="name" x="592" y="252">Green code</text><text class="label" x="592" y="300">GATE</text><text class="name" x="592" y="324">Format + types</text><text class="label" x="592" y="372">OUTPUT</text><text class="name" x="592" y="396">Clear boundaries</text><text class="tag" x="736" y="120">4 · VERIFY</text><rect class="node" x="720" y="144" width="192" height="272" rx="8"/><text class="name" x="816" y="184">Is it current?</text><text class="label" x="816" y="228">INPUT</text><text class="name" x="816" y="252">Final bytes</text><text class="label" x="816" y="300">GATE</text><text class="name" x="816" y="324">Full + browser</text><text class="label" x="816" y="372">OUTPUT</text><text class="name" x="816" y="396">Evidence ledger</text><line x1="40" y1="552" x2="920" y2="552" stroke="#a9b2aa"/><text class="legend" x="40" y="576">PATTERN · STAGE FRAMEWORK WITH SEMANTIC SLOTS  |  STATIC · OFFLINE-SAFE  |  SOURCE · CURRENT REPOSITORY</text></svg>
