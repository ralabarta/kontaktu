<svg viewBox="0 0 960 600" role="img" aria-labelledby="architecture-title architecture-desc" xmlns="http://www.w3.org/2000/svg"><title id="architecture-title">System architecture</title><desc id="architecture-desc">The current dependency path keeps Next.js at the boundary, validates transport data, and points inward to framework-free contact rules and a server-only synthetic repository.</desc><defs><marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5a665f"/></marker><marker id="architecture-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#285a32"/></marker><marker id="architecture-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17364b"/></marker></defs><rect width="960" height="600" fill="#eeefe8"/><rect class="zone" x="40" y="48" width="880" height="112" rx="8"/><text class="tag" x="56" y="68">NEXT.JS BOUNDARY</text><rect class="zone" x="40" y="184" width="880" height="216" rx="8"/><text class="tag" x="56" y="204">CONTACT FEATURE</text><rect class="zone" x="40" y="424" width="880" height="96" rx="8"/><text class="tag" x="56" y="444">SERVER-ONLY DATA</text><line class="edge-accent" x1="280" y1="128" x2="280" y2="240" marker-end="url(#architecture-arrow-accent)"/><line class="edge" x1="680" y1="128" x2="680" y2="240" marker-end="url(#architecture-arrow)"/><path class="edge" d="M280 304V328Q280 336 288 336H432Q440 336 440 344V352" marker-end="url(#architecture-arrow)"/><path class="edge" d="M680 304V328Q680 336 672 336H528Q520 336 520 344V352" marker-end="url(#architecture-arrow)"/><path class="edge" d="M480 416V432Q480 440 488 440H672Q680 440 680 448V456" marker-end="url(#architecture-arrow)"/><rect class="focal" x="160" y="80" width="240" height="48" rx="8"/><text class="name" x="280" y="104">Pages + workspace</text><text class="sub" x="280" y="120">App Router · client effects</text><rect class="node" x="560" y="80" width="240" height="48" rx="8"/><text class="name" x="680" y="104">Route Handlers</text><text class="sub" x="680" y="120">HTTP status + no-store</text><rect class="node" x="160" y="240" width="240" height="64" rx="8"/><text class="name" x="280" y="272">Application contracts</text><text class="sub" x="280" y="288">Zod envelopes · DTO mapping</text><rect class="node" x="560" y="240" width="240" height="64" rx="8"/><text class="name" x="680" y="272">Domain rules</text><text class="sub" x="680" y="288">policy · duplicates · precedence</text><rect class="node" x="360" y="352" width="240" height="64" rx="8"/><text class="name" x="480" y="384">Normalized contact</text><text class="sub" x="480" y="400">framework-free model</text><rect class="soft" x="560" y="456" width="240" height="48" rx="8"/><text class="name" x="680" y="480">Synthetic repository</text><text class="sub" x="680" y="496">fixed tenant · immutable fixture</text><line x1="40" y1="552" x2="920" y2="552" stroke="#a9b2aa"/><text class="legend" x="40" y="576">PATTERN · INWARD DEPENDENCY LAYERS  |  STATIC · OFFLINE-SAFE  |  SOURCE · CURRENT REPOSITORY</text></svg>
